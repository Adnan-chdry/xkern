set timeout=0
set default=0

insmod all_video
insmod gfxterm
insmod vbe
insmod edid

loadfont ($root)/boot/grub/fonts/unicode.pf2

# Screen resolution is decided by GRUB, never by the kernel:
#   gfxmode=auto  -> use the monitor's preferred mode (EDID), falling back
#                    to the highest safe VBE mode when no EDID is present.
#   gfxpayload=keep -> hand that exact mode to the kernel through the
#                    Multiboot 2 framebuffer tag; the kernel reads the
#                    geometry from there and supports any mode/bpp.
#
# To force a specific mode, replace auto with e.g.:
#   set gfxmode=1920x1080x32,1280x800,auto
set gfxmode=640x400

terminal_output gfxterm

set gfxpayload=keep

menuentry "xkern" {
    set gfxpayload=keep
    multiboot2 /boot/kernel
    module2 /boot/init.cpio
    boot
}
